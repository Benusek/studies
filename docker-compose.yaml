services:

  backend:
    build:
      context: ${BACK_HOST}
    container_name: backend
    restart: unless-stopped
    working_dir: ${APP_CONTAINER}
    volumes:
      - ${BACK_HOST}:${APP_CONTAINER}
    command: sh -c "php artisan migrate:fresh --seed && php-fpm"
    depends_on:
      - db
      - composer

  frontend:
    restart: unless-stopped

    build:
      context: ${FRONT_HOST}

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ${BACK_HOST}:/var/www/backend
      # - ${FRONT_HOST}/dist:/var/www/frontend/dist
      - ${FRONT_HOST}:/var/www/frontend
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend

  db:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: studies
    ports:
      - "3306:3306"
    volumes:
      - ${DB_HOST}:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: pass
    depends_on:
      - db

  composer:
    image: composer:2
    container_name: composer
    working_dir: ${APP_CONTAINER}
    volumes:
      - ${BACK_HOST}:${APP_CONTAINER}
    command: composer install --optimize-autoloader

