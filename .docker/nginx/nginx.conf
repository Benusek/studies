events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    client_max_body_size 2G;
    
    upstream php {
        server backend:9000;
    }

    server {
        listen 80;
        server_name localhost;

        root /var/www/frontend/dist;
        index index.php index.html;

        add_header Access-Control-Allow-Origin "http://localhost:5173" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        
        location /hls/ {
            alias /var/www/backend/storage/app/public/videos/hls/;
            
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Headers "*" always;
        }

        location / {
            if ($request_method = OPTIONS) {
                return 204;
            }
            try_files $uri $uri/ /index.html;
        }

        location /api {
            try_files $uri /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_read_timeout 3600;
        }

        location /avatars/ {
            alias /var/www/backend/storage/app/avatars/;
            expires 30d;
            access_log off;
        }

        location /previews/ {
            alias /var/www/backend/storage/app/previews/;
            expires 30d;
        }

        location ~ /\. {
            deny all;
        }
    }
}